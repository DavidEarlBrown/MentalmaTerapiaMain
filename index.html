<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentalma Consulting</title>

    <!-- ── Google Analytics 4 ─────────────────────────────────────────────
         Replace G-PLACEHOLDER with your real Measurement ID in .env:
           VITE_GA_MEASUREMENT_ID=G-XXXXXXXXXX
         Then redeploy. Tracking is silently skipped if the ID is missing.
    ──────────────────────────────────────────────────────────────────── -->
    <script>
      (function () {
        var id = '%VITE_GA_MEASUREMENT_ID%';
        if (!id || id === 'G-PLACEHOLDER' || id.startsWith('%VITE_')) return;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { window.dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', id, { send_page_view: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
